<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>anyseek — 涌现的对数螺旋（紧凑版）</title>
  <desc>Compact logarithmic spiral (b≈0.28). Scaled 0.7 from base v2. Color #E07A5F.</desc>

  <defs>
    <linearGradient id="spiralV2c" gradientUnits="userSpaceOnUse"
                    x1="95.40" y1="96" x2="138.49" y2="96">
      <stop offset="0%"   stop-color="#E07A5F" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#E07A5F" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#E07A5F" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- 层 1：混沌散点（20 个，四角四边覆盖） -->
  <g fill="#E07A5F">
    <circle cx="28"  cy="18"  r="1.2" opacity="0.20"/>
    <circle cx="52"  cy="14"  r="1.0" opacity="0.18"/>
    <circle cx="105" cy="16"  r="1.0" opacity="0.18"/>
    <circle cx="155" cy="14"  r="1.1" opacity="0.19"/>
    <circle cx="18"  cy="55"  r="1.1" opacity="0.19"/>
    <circle cx="22"  cy="110" r="1.2" opacity="0.20"/>
    <circle cx="14"  cy="130" r="1.0" opacity="0.18"/>
    <circle cx="184" cy="55"  r="1.1" opacity="0.19"/>
    <circle cx="186" cy="108" r="1.2" opacity="0.20"/>
    <circle cx="175" cy="135" r="1.0" opacity="0.18"/>
    <circle cx="16"  cy="165" r="1.3" opacity="0.22"/>
    <circle cx="35"  cy="176" r="1.0" opacity="0.18"/>
    <circle cx="180" cy="158" r="1.3" opacity="0.22"/>
    <circle cx="140" cy="178" r="1.0" opacity="0.18"/>
    <circle cx="40"  cy="40"  r="0.9" opacity="0.13"/>
    <circle cx="160" cy="40"  r="0.8" opacity="0.12"/>
    <circle cx="45"  cy="60"  r="0.7" opacity="0.10"/>
    <circle cx="170" cy="65"  r="0.9" opacity="0.13"/>
    <circle cx="95"  cy="10"  r="0.8" opacity="0.12"/>
    <circle cx="60"  cy="184" r="0.9" opacity="0.13"/>
  </g>

  <!-- 层 2：主螺线（缩放至原 v2 的 70%，居中微调） -->
  <path d="M 95.40 96.00
           L 95.41 95.23 L 95.00 94.44 L 94.15 93.88 L 92.98 93.77
           L 91.75 94.31 L 90.79 95.55 L 90.51 97.31 L 91.20 99.24
           L 92.96 100.82 L 95.61 101.44 L 98.62 100.60 L 101.20 98.09
           L 102.42 94.15 L 101.48 89.49 L 97.96 85.30 L 92.09 83.03
           L 84.92 83.96 L 78.20 88.85 L 74.11 97.41 L 74.76 108.47
           L 77.50 114.19 L 81.46 119.19 L 87.75 123.57 L 94.13 126.32
           L 101.97 127.50 L 110.88 126.51 L 119.48 123.35 L 127.83 117.52
           L 134.33 110.69 L 138.42 103.43 L 138.49 96.00"
        fill="none"
        stroke="url(#spiralV2c)"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- 层 3：节点（5 个，沿螺线由内到外递增） -->
  <circle cx="92.98"  cy="93.77"  r="1.4" fill="#E07A5F" opacity="0.55"/>
  <circle cx="95.61"  cy="101.44" r="1.7" fill="#E07A5F" opacity="0.70"/>
  <circle cx="92.09"  cy="83.03"  r="2.2" fill="#E07A5F" opacity="0.82"/>
  <circle cx="94.13"  cy="126.32" r="2.6" fill="#E07A5F" opacity="0.90"/>

  <!-- 层 4：求索端点（外侧实心 + 光晕环） -->
  <circle cx="138.49" cy="96.00" r="7"   fill="none" stroke="#E07A5F" stroke-width="0.7" opacity="0.30"/>
  <circle cx="138.49" cy="96.00" r="4.2" fill="#E07A5F" opacity="1"/>
</svg>
